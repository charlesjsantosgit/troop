name: Deploy dedicated server

on:
  workflow_dispatch:
    inputs:
      verify_deployment_run:
        description: "Verify an existing deployment run without rebuilding or restarting its server"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - Dockerfile
      - export_presets.cfg
      - fly.toml
      - server-entrypoint.sh
      - project.godot
      - scenes/**
      - scripts/**
      - .github/workflows/deploy-server.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: troop-dedicated-server-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Fly.io
    if: ${{ vars.FLY_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f fly.toml
          test -f export_presets.cfg

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Verify installed client source identity
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check packaging/server-runtime.sha256 > /tmp/runtime-checks.log
          cat packaging/server-deployment.json
          echo "All installed-client runtime source hashes match."

      - name: Build matching dedicated server
        if: ${{ inputs.verify_deployment_run == '' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}"
          test -n "${FLY_APP_NAME:-}"
          mkdir -p artifacts/server-deployment
          flyctl deploy --app "$FLY_APP_NAME" --config fly.toml \
            --ha=false --remote-only --build-only --push \
            --image-label "installed-0.8.0.1-${GITHUB_SHA}" \
            --wait-timeout 10m 2>&1 | tee artifacts/server-deployment/build.log

      - name: Preserve current server and snapshot world volume
        if: ${{ inputs.verify_deployment_run == '' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          python3 hosting/server_rollout_guard.py prepare \
            --app "$FLY_APP_NAME" --evidence artifacts/server-deployment \
            --candidate-image "registry.fly.io/${FLY_APP_NAME}:installed-0.8.0.1-${GITHUB_SHA}"

      - name: Deploy verified image
        if: ${{ inputs.verify_deployment_run == '' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy --app "$FLY_APP_NAME" --config fly.toml \
            --image "registry.fly.io/${FLY_APP_NAME}:installed-0.8.0.1-${GITHUB_SHA}" \
            --ha=false --update-only --wait-timeout 10m \
            2>&1 | tee artifacts/server-deployment/deploy.log

      - name: Load existing deployment evidence for verification only
        if: ${{ inputs.verify_deployment_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_DEPLOYMENT_RUN: ${{ inputs.verify_deployment_run }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERIFY_DEPLOYMENT_RUN" =~ ^[0-9]+$ ]]
          artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFY_DEPLOYMENT_RUN}/artifacts" \
            --jq '[.artifacts[] | select(.expired == false and (.name | startswith("server-deployment-")))] | sort_by(.created_at) | last | .id')
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/prior-server-evidence.zip
          mkdir -p artifacts/server-deployment
          unzip -q /tmp/prior-server-evidence.zip -d artifacts/server-deployment

      - name: Verify running image, retained world volume and exported server boot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          python3 hosting/server_rollout_guard.py verify \
            --app "$FLY_APP_NAME" --evidence artifacts/server-deployment
          # Fly's historical log buffer can return stale entries. The immutable
          # running image is checked above; its real Linux boot is checked here.
          # Authenticated public-client gameplay verification is a separate gate.
          grep -E 'DEDICATED_SERVER_READY version=0[.]8[.]0[.]1 protocol=18 ' \
            artifacts/server-deployment/build.log > artifacts/server-deployment/exported-server-ready.log
          cat artifacts/server-deployment/exported-server-ready.log

      - name: Retain deployment and rollback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-deployment-${{ github.sha }}
          path: artifacts/server-deployment/
          if-no-files-found: warn
          retention-days: 7
